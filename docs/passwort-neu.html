<body>
<header class="site">
  <span class="mark" aria-hidden="true">F</span>
  <strong>Finance App</strong>
</header>
<main class="wrap">
  <h1>Neues Passwort setzen</h1>
  <div class="card">
    <div id="msg" class="msg info" role="status">Recovery-Link wird geprüft …</div>
    <div id="form" class="hidden">
      <label for="pw1">Neues Passwort (mind. 12 Zeichen)</label>
      <input id="pw1" type="password" autocomplete="new-password">
      <label for="pw2">Passwort wiederholen</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <div class="row"><button id="saveBtn" type="button">Passwort speichern</button></div>
      <p class="small">Danach kannst du dich wieder in der App und unter <a href="konto-loeschen.html">Kontolöschung</a> anmelden.</p>
    </div>
  </div>
</main>
<footer class="site">Finance App · <a href="index.html">Start</a> · <a href="datenschutz.html">Datenschutz</a></footer>
