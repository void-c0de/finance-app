name: iOS unsigned build

# Manual only — consumes macOS Actions minutes. Produces an UNSIGNED .ipa that
# you sign locally on Windows with AltStore/Sideloadly using your own free Apple
# ID (Personal Team). No Apple Developer Program membership. No Apple credentials
# in CI. See IOS_FREE_DEVICE_INSTALL.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select the newest installed Xcode
        run: |
          set -eo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: ios
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Build unsigned (Release, device SDK)
        working-directory: ios
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # the app scheme is the one whose name matches a *.xcodeproj (not EASClient / Pods)
          PROJ=$(ls -d *.xcodeproj | head -1); APPSCHEME="${PROJ%.xcodeproj}"
          SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).workspace.schemes.join(' ')))")
          echo "Available schemes: $SCHEMES"
          case " $SCHEMES " in *" $APPSCHEME "*) SCHEME="$APPSCHEME";; *) SCHEME=$(echo $SCHEMES | tr ' ' '\n' | grep -v -E '^(EASClient|Pods.*)$' | head -1);; esac
          echo "Workspace=$WORKSPACE Scheme=$SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            clean build

      - name: Verify the app bundle (arch, encryption, SQLCipher, plist)
        working-directory: ios
        run: |
          set -eo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | grep -v "\.app/" | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; ls -R build/Build/Products | head -60; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          BIN="$APP/$(defaults read "$PWD/$APP/Info" CFBundleExecutable)"
          echo "=== Info.plist (key values) ==="
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleName CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '%s = %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo '-')"
          done
          echo "=== NSFaceIDUsageDescription ==="
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$APP/Info.plist" || true
          echo "=== Architectures ==="
          lipo -archs "$BIN" || file "$BIN"
          echo "=== Is the main binary encrypted? (expect cryptid 0 = unsigned/unencrypted) ==="
          otool -l "$BIN" | grep -A4 LC_ENCRYPTION_INFO || echo "no LC_ENCRYPTION_INFO"
          echo "=== PrivacyInfo.xcprivacy present? ==="
          find "$APP" -name "PrivacyInfo.xcprivacy" -print
          echo "=== SQLCipher / SQLite linkage ==="
          (otool -L "$BIN"; find "$APP/Frameworks" -maxdepth 1 -type d 2>/dev/null) | grep -iE "sqlcipher|sqlite|crypto|commoncrypto" || echo "(statically linked — checking symbols)"
          nm -a "$BIN" 2>/dev/null | grep -iE "sqlite3_key|sqlcipher_" | head -5 || echo "(no exported sqlcipher symbols in main binary — expo-sqlite links it in its own module)"
          echo "=== expo-sqlite module binary ==="
          SQ=$(find "$APP" -iname "*sqlite*" -type f | head -3); echo "$SQ"
          for f in $SQ; do echo "--- $f"; nm -a "$f" 2>/dev/null | grep -iE "sqlite3_key|codec|sqlcipher" | head -5 || true; done
          echo "=== Embedded frameworks ==="
          ls -1 "$APP/Frameworks" 2>/dev/null || echo "(none / static)"

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -eo pipefail
          echo "App bundle: $APP"
          rm -rf Payload FinanceApp-ios-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FinanceApp-ios-unsigned.ipa Payload
          unzip -l FinanceApp-ios-unsigned.ipa | tail -20
          echo "IPA size: $(du -h FinanceApp-ios-unsigned.ipa | cut -f1)"
          shasum -a 256 FinanceApp-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceApp-ios-unsigned-ipa
          path: ios/FinanceApp-ios-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
